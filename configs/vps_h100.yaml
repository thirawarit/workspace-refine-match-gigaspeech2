# VPS profile: single usable H100 (index 0), 24 cores, 503 GB RAM, Python 3.12.
# Merged over default.yaml.

paths:
  # PARENT of train/, not train/ itself: records.py appends its own "train"
  # segment, so "8-8888-3" resolves to
  #   <audio_root>/train/8/8888/8-8888-3.wav
  # Pointing this at .../th/train would build .../th/train/train/8/... and miss
  # 100% of lookups — which looks correct at a glance and is not.
  audio_root: "/home/my/path/datasets/gigaspeech2/data/th"
  # Kept in-repo: that disk is known to exist and have room (the CUDA wheels
  # already unpack there). Move these if a larger volume is available — ~9.5M
  # predictions plus sharded checkpoints.
  output_dir: "./data/predictions"
  checkpoint_dir: "./data/checkpoints"
  log_dir: "./logs"
  scratch_dir: "./data/scratch"

device:
  prefer: ["cuda", "cpu"]
  cuda_index: 0
  allow_mps: false

batch:
  batch_size: 16
  sort_buffer_size: 4096
  max_batch_duration_seconds: 480.0

runtime:
  io_workers: 12          # of 24 cores; the rest stay free for the data loader
  progress_every_n: 1000
  max_consecutive_batch_failures: 5
  log_level: "INFO"
