# Baseline configuration. Override per-host with vps_h100.yaml / local_cpu.yaml.

paths:
  # Audio files live at <audio_root>/train/<sid_idx0>/<sid_idx1>/<sid>.wav
  audio_root: "./data/audio"
  output_dir: "./data/predictions"
  checkpoint_dir: "./data/checkpoints"
  log_dir: "./logs"
  scratch_dir: "./data/scratch"

model:
  hf_repo_id: "typhoon-ai/typhoon-whisper-medium"
  # Set to skip the HuggingFace download and use a local checkpoint directory.
  local_model_path: null
  # Whisper expects ISO-639-1 ("th"), not a BCP-47 tag ("th-TH").
  target_lang: "th"
  task: "transcribe"
  dtype: "bfloat16"       # bfloat16 | float16 | float32
  max_new_tokens: 440
  sampling_rate: 16000

device:
  # Walked in order. Entries are 'cpu', 'mps', 'cuda' or 'cuda:N'.
  # A bare 'cuda' uses cuda_index below; 'cuda:N' overrides it.
  # 'mps' is ignored unless allow_mps is true.
  prefer: ["cuda", "cpu"]
  # Which GPU to use. GPU index 1 is fully occupied on the VPS; pin to 0.
  # Override per-run with --cuda-index N or --device cuda:N.
  #
  # NOTE: CUDA_VISIBLE_DEVICES (exported by setup_and_run.sh) *renumbers*
  # devices — under a mask of "1" the only visible GPU is cuda:0, not cuda:1.
  # Set one or the other, not both.
  cuda_index: 0
  allow_mps: false

batch:
  batch_size: 16                    # per the model card
  sort_buffer_size: 2048            # local length-bucketing window
  max_batch_duration_seconds: 480.0 # caps activation memory on long-clip windows

audio:
  target_sample_rate: 16000
  mono: true
  # Defensive: conforming files take a no-op fast path (header read only).
  resample_on_the_fly: true
  ffmpeg_binary: "ffmpeg"
  ffmpeg_timeout_seconds: 60.0
  # Whisper's encoder window. Longer clips are silently truncated by the feature
  # extractor, so they are flagged and logged rather than passing unnoticed.
  max_duration_seconds: 30.0

checkpoint:
  enabled: true
  flush_every_n: 200
  flush_every_seconds: 30.0
  max_cached_shards: 4              # LRU bound on in-memory done-sets

runtime:
  io_workers: 8
  progress_every_n: 500
  max_consecutive_batch_failures: 5 # abort rather than write empty rows for hours
  log_level: "INFO"
