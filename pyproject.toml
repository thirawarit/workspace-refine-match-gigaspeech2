[project]
name = "thai-asr-batch"
version = "0.1.0"
description = "Batch ASR inference over GigaSpeech2 Thai transcripts"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub==0.26.2",
    "numpy==1.26.4",
    "pyyaml==6.0.2",
    "soundfile==0.12.1",
    "torch>=2.6.0",
    "tqdm==4.67.1",
    "transformers>=4.50.3",
]

[project.scripts]
thai-asr-batch = "thai_asr_batch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-mock==3.14.0",
]
